<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>So you think you can play Yatzee?</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>So you think you can play Yatzee?</h1>
    <div class="topbar-actions">
      <button id="hiscores-btn" class="ghost">Hiscores</button>
      <button id="new-game-btn">New Game</button>
    </div>
  </header>

  <main id="app">
    <div class="accuracy-display" id="accuracy-display">
      <span class="accuracy-label">Accuracy</span>
      <span class="accuracy-value" id="stat-accuracy">NaN</span>
    </div>

    <div class="game-card">
      <section class="panel scorecard-panel">
        <table class="scorecard" id="scorecard">
          <colgroup>
            <col />
            <col style="width: 80px" />
            <col style="width: 100px" />
          </colgroup>
          <tbody id="scorecard-upper"></tbody>
          <tbody id="scorecard-upper-summary"></tbody>
          <tbody id="scorecard-lower"></tbody>
          <tbody id="scorecard-footer"></tbody>
        </table>
      </section>

      <section class="panel dice-panel" id="dice-panel">
        <h2 id="rerolls-label"></h2>
        <div class="dice-row-wrap">
          <div class="dice-row" id="dice-row"></div>
          <div class="dice-feedback" id="dice-feedback"></div>
        </div>
        <div class="dice-controls">
          <button id="roll-btn">Roll</button>
        </div>
      </section>
    </div>
  </main>

  <div class="modal-backdrop" id="final-modal" hidden>
    <div class="modal">
      <h2>Game Over</h2>
      <p id="final-text"></p>
      <button id="final-new-game-btn">Play Again</button>
    </div>
  </div>

  <div class="modal-backdrop" id="nickname-modal">
    <div class="modal">
      <h2>What should we call you?</h2>
      <p>Your nickname is used to record your games on the hiscores board.</p>
      <form id="nickname-form">
        <input id="nickname-input" type="text" maxlength="32" placeholder="Nickname" autocomplete="off" required />
        <button type="submit">Start Playing</button>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="hiscores-modal" hidden>
    <div class="modal modal-wide">
      <h2>Hiscores</h2>
      <div class="hiscores-sort-toggle">
        <button id="sort-accuracy-btn" class="ghost sort-btn active">By Accuracy</button>
        <button id="sort-score-btn" class="ghost sort-btn">By Score</button>
      </div>
      <div class="hiscores-table-wrap">
        <table class="hiscores-table" id="hiscores-table">
          <thead>
            <tr><th>#</th><th>Nickname</th><th>Score</th><th>Accuracy</th><th>Time</th><th>Date</th></tr>
          </thead>
          <tbody id="hiscores-body"></tbody>
        </table>
      </div>
      <button id="hiscores-close-btn" class="ghost">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
